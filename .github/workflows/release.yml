name: Release firmware

on:
  workflow_dispatch:
  push:
    branches:
      - release

permissions:
  contents: read

concurrency:
  group: firmware-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/release'
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware-artifact

      - name: Select release version
        id: version
        run: |
          tag=$(python3 scripts/release_firmware.py tag --commit "$GITHUB_SHA")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Validate and package firmware
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          python3 scripts/release_firmware.py package \
            --input firmware-artifact --output dist \
            --commit "$GITHUB_SHA" --tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Publish GitHub Release
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            if python3 -c 'import json; import sys; sys.exit(0 if json.load(open("release-state.json"))["isDraft"] else 1)'; then
              echo "Resuming draft $RELEASE_TAG"
            else
              echo "$RELEASE_TAG is already published for this commit; preserving its assets."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" \
              --title "Eyelash Sofle $RELEASE_TAG" --notes-file dist/RELEASE_NOTES.md
          fi
          gh release edit "$RELEASE_TAG" --target "$GITHUB_SHA" \
            --notes-file dist/RELEASE_NOTES.md
          gh release upload "$RELEASE_TAG" dist/*.uf2 dist/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
